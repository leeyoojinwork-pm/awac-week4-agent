  <style>
    :root{--ink:#0b1018;--text:#f5f7fa;--muted:#9ba7b5;--blue:#5aa7ff;--line:rgba(255,255,255,.15);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}.page{display:grid;grid-template-rows:auto 1fr;height:100%}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:70px;padding:12px 22px;border-bottom:1px solid var(--line)}.title-wrap{display:flex;align-items:center;gap:14px;min-width:0}.speaker{flex:0 0 auto;padding:8px 11px;border-radius:9px;background:var(--blue);color:var(--ink);font-size:13px;font-weight:900}h1{margin:0;overflow:hidden;font-size:18px;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}nav{display:flex;flex:0 0 auto;gap:8px}.button{display:inline-flex;align-items:center;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px;font-weight:800;text-decoration:none}.button.primary{border-color:var(--blue);background:var(--blue);color:var(--ink)}
    .viewer{width:100%;height:100%;border:0;background:#e8edf3}.fallback{display:grid;place-items:center;height:100%;padding:28px;text-align:center}.fallback p{max-width:560px;color:var(--muted);font-size:16px;line-height:1.6}
    @media(max-width:640px){header{padding:10px 12px}h1{font-size:15px}.button:not(.primary){display:none}.button{min-height:40px;padding:0 12px}}
  </style>
</head>

    <object class="viewer" data="AWAC-week4-mh.pdf#view=FitH" type="application/pdf"><div class="fallback"><p>이 브라우저에서는 PDF를 화면 안에 표시할 수 없습니다. 위의 PDF 새 창 버튼으로 강의덱을 열어주세요.</p></div></object>
