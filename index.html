<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131d">
  <meta name="description" content="AWAC 1기 4주차 육민호, 이유진 강의덱 선택">
  <title>AWAC 1기 4주차 | 강의덱 선택</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317131d'/%3E%3Cpath d='M14 45 25 17h9l5 13 5-13h7L39 47h-8l-5-14-5 14z' fill='%238d6cff'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#17131d;--panel:#211a2b;--text:#f8f6fb;--muted:#b8afc1;--purple:#8d6cff;--blue:#5aa7ff;--line:rgba(255,255,255,.15);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{min-height:100%}
    body{margin:0;color:var(--text);background:radial-gradient(circle at 12% 15%,rgba(90,167,255,.16),transparent 28rem),radial-gradient(circle at 88% 84%,rgba(141,108,255,.19),transparent 30rem),var(--ink)}
    .shell{width:min(1420px,calc(100% - 64px));min-height:100vh;margin:0 auto;padding:34px 0 28px;display:grid;grid-template-rows:auto auto 1fr auto}
    header{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:900}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--purple);color:#fff;font-size:14px}.week-label{color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.08em}
    .intro{padding:54px 0 36px}.eyebrow{margin:0 0 14px;color:var(--purple);font-size:14px;font-weight:900;letter-spacing:.1em}h1{margin:0;font-size:clamp(42px,5vw,72px);line-height:1.04;letter-spacing:-.055em}.intro p:last-child{margin:18px 0 0;color:var(--muted);font-size:17px;line-height:1.6}
    .deck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-self:center}.deck-card{position:relative;min-height:360px;padding:30px;overflow:hidden;border:1px solid var(--line);border-radius:18px;color:var(--text);text-decoration:none;transition:transform .18s ease,border-color .18s ease}.deck-card:hover,.deck-card:focus-visible{transform:translateY(-5px);outline:none}.deck-card.mh{background:linear-gradient(145deg,rgba(4,11,25,.98),rgba(14,25,50,.92)),var(--panel)}.deck-card.mh:hover,.deck-card.mh:focus-visible{border-color:var(--blue)}.deck-card.yj{background:linear-gradient(145deg,rgba(39,25,67,.96),rgba(22,17,29,.95)),var(--panel)}.deck-card.yj:hover,.deck-card.yj:focus-visible{border-color:var(--purple)}
    .card-top{display:flex;align-items:center;justify-content:space-between}.initials{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.09);font-size:15px;font-weight:900;letter-spacing:.04em}.mh .initials{color:#89c2ff}.yj .initials{color:#bda7ff}.deck-type{color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.08em}.deck-card h2{margin:64px 0 14px;max-width:560px;font-size:clamp(30px,3.4vw,48px);line-height:1.12;letter-spacing:-.045em}.deck-card p{margin:0;max-width:560px;color:var(--muted);font-size:16px;line-height:1.65}.open-label{position:absolute;left:30px;bottom:28px;padding-top:10px;border-top:3px solid var(--purple);font-size:14px;font-weight:900}.mh .open-label{border-top-color:var(--blue)}
    footer{display:flex;justify-content:space-between;gap:24px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    @media(max-width:820px){.shell{width:min(100% - 32px,1420px);padding-top:20px}.week-label{display:none}.intro{padding:42px 0 28px}h1{font-size:clamp(38px,11vw,56px)}.deck-grid{grid-template-columns:1fr}.deck-card{min-height:320px;padding:24px}.deck-card h2{margin-top:42px}.open-label{left:24px;bottom:24px}footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="brand-mark">A1</span><span>AWAC 1기</span></div><span class="week-label">WEEK 04</span></header>
    <section class="intro" aria-labelledby="page-title"><p class="eyebrow">AWAC 4주차</p><h1 id="page-title">강의덱을 선택하세요.</h1><p>발표 순서에 맞춰 각 강의덱을 별도 주소에서 열 수 있습니다.</p></section>
    <section class="deck-grid" aria-label="발표자별 강의덱">
      <a class="deck-card mh" href="_mh/"><div class="card-top"><span class="initials">MH</span><span class="deck-type">PDF DECK</span></div><h2>육민호 강의덱</h2><p>AI에게 내 일을 이어 맡기는 법<br>자료를 정리하고 연결하는 다섯 단계</p><span class="open-label">강의덱 열기</span></a>
      <a class="deck-card yj" href="_yj/"><div class="card-top"><span class="initials">YJ</span><span class="deck-type">WEB DECK</span></div><h2>이유진 강의덱</h2><p>매번 달라지는 멘토링 피드백에 기준을 만들다</p><span class="open-label">강의덱 열기</span></a>
    </section>
    <footer><span>AWAC 1기 4주차</span><span>© 2026 육민호, 이유진. All rights reserved.</span></footer>
  </main>
</body>
</html>
