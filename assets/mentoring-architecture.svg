<g><rect x="18" y="140" width="200" height="64" rx="7" fill="#fff" stroke="#e2dce9"/><image xlink:href="icon-notion.svg" x="35" y="160" width="22" height="22"/><text class="name" x="70" y="167">Notion</text><text class="detail" x="70" y="187">판단 기준과 검수 기록</text></g>
<g><rect x="18" y="212" width="200" height="64" rx="7" fill="#fff" stroke="#e2dce9"/><image xlink:href="icon-google-drive.svg" x="35" y="232" width="22" height="22"/><text class="name" x="70" y="239">Drive</text><text class="detail" x="70" y="259">첨부 자료와 PDF</text></g>
<rect x="472" y="92" width="324" height="66" rx="7" fill="#6c3bf2"/><text x="634" y="119" text-anchor="middle" style="fill:white;font-size:20px;font-weight:600">Orchestrator</text><text x="634" y="141" text-anchor="middle" style="fill:#eee7ff;font-size:13px">업무 분배 → 공통 진단 공유 → 결과 취합</text>
