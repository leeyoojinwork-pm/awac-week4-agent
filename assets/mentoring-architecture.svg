<rect x="344" y="350" width="580" height="62" rx="7" fill="#fff" stroke="#d9d1e4"/><text class="name" x="365" y="376">기준과 실행 기록</text><text class="detail" x="365" y="399">input / criteria / skills / outputs / logs</text><text class="detail accent" x="902" y="386" text-anchor="end">수정 이유 → 기준 반영</text>
