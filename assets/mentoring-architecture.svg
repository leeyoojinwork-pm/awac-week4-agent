<rect x="780" y="211" width="122" height="80" rx="6" fill="white" stroke="#d9cfee"/><text class="name" x="841" y="243">검수 Agent</text><text class="detail" x="841" y="269">품질 검수 Skill</text></g>
<rect x="974" y="112" width="208" height="99" rx="8" fill="#f4efff" stroke="#a98bea"/><text class="name accent" x="1078" y="151" text-anchor="middle">멘토 최종 승인</text><text class="detail" x="1078" y="179" text-anchor="middle">예외 판단과 발송 결정</text>
