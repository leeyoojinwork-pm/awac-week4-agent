<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">멘토링 운영 OS 아키텍처</title><desc id="desc">Slack, Notion, Drive에서 자료를 연결해 Claude Code의 총괄과 역할별 Agent가 작업합니다. 멘토 승인 후 PDF와 Slack을 전달하고 수정 기록을 기준에 반영합니다.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#9689ae"/></marker></defs>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#292331} .label{font-size:11px;letter-spacing:1.2px;fill:#81768e;font-weight:600}.name{font-size:18px;font-weight:600}.detail{font-size:13px;fill:#756b80}.line{fill:none;stroke:#bfb6ce;stroke-width:1.4}.accent{fill:#6c3bf2}</style>
<rect width="1200" height="440" fill="white"/>
<text class="label" x="18" y="23">01 / 연결 도구</text><text class="label" x="352" y="23">02 / 실행 환경</text><text class="label" x="978" y="23">03 / 검수와 전달</text>
